<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>პატარა გაცნობა 💌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@500;700&family=Noto+Sans+Georgian:wght@400;600&display=swap">
<style>
:root{--bg:#f6e6ec;--bg2:#efd3df;--card:#fffafb;--text:#2b1630;--muted:#7d6283;--accent:#e8445e;--line:#ecd0da;--ok:#2f9e63;--bad:#d2405a;--paper:#fde9e0;--gold:#d99a1c;
--serif:"Noto Serif Georgian",Georgia,"Times New Roman",serif;--sans:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e0f27;--bg2:#2d1438;--card:#2a1735;--text:#f8e9f0;--muted:#b9a0c2;--accent:#ff6a80;--line:#47285a;--ok:#4cc585;--bad:#ff6a80}}
:root[data-theme="dark"]{--bg:#1e0f27;--bg2:#2d1438;--card:#2a1735;--text:#f8e9f0;--muted:#b9a0c2;--accent:#ff6a80;--line:#47285a;--ok:#4cc585;--bad:#ff6a80}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;justify-content:center;padding:22px 16px}
main{width:100%;max-width:460px;align-self:center}
h1,.q{font-family:var(--serif);font-weight:700;line-height:1.25;margin:0}
h1{font-size:1.7rem}
p{line-height:1.6;color:var(--muted);margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hearts{display:flex;gap:5px;justify-content:center;margin-bottom:22px}
.hearts span{font-size:.95rem;filter:grayscale(1);opacity:.35;transition:.3s}
.hearts span.on{filter:none;opacity:1;transform:scale(1.15)}
.q{font-size:1.35rem;margin-bottom:18px}
button,a.btn{font:inherit;cursor:pointer}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;color:var(--text);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;transition:border-color .15s,background .15s}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:.85rem;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-weight:600;margin-top:18px}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);margin-top:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.c{text-align:center}
.emoji{font-size:3rem;text-align:center;margin-bottom:10px}
/* ბილეთი */
.ticket{position:relative;background:var(--paper);color:#2b1630;border-radius:20px;padding:26px 22px 22px;animation:in .5s ease;
-webkit-mask:radial-gradient(circle 12px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;
mask:radial-gradient(circle 12px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket small{display:block;color:#8a5d6a;font-size:.8rem}
.ticket h1{font-size:1.6rem;margin-top:4px}
.perf{border-top:2px dashed #d9aab5;margin:22px 4px 20px}
.stamp{position:absolute;top:18px;right:18px;border:2px solid var(--gold);color:var(--gold);border-radius:12px;padding:4px 10px;font-weight:600;font-size:.9rem;transform:rotate(8deg)}
.ticket .ask{font-family:var(--serif);font-size:1.25rem;font-weight:700;margin:0 0 4px}
.ticket .btn{margin-top:14px}
.ticket .btn.ghost{color:#7d5a68;border-color:#d9aab5}
.field{width:100%;font:inherit;color:var(--text);background:transparent;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:18px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.sum{white-space:pre-wrap;text-align:left;font-size:.9rem;line-height:1.55;background:#fff7f3;border:1px dashed #d9aab5;border-radius:12px;padding:12px 14px;margin:12px 0 0;color:#2b1630}
.ans{margin:0;padding:0;list-style:none;font-size:.88rem;line-height:1.5;color:#4a2f3c}
.ans li{padding:5px 0;border-bottom:1px dotted #e3bcc6}
.ans li span{color:#2b1630;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;cursor:pointer;background:transparent;color:#2b1630;border:1.5px solid #d9aab5;border-radius:999px;padding:9px 14px}
.chip:hover{border-color:var(--accent)}
.bigstamp{position:absolute;left:50%;top:42%;translate:-50% -50%;rotate:-12deg;border:4px solid var(--accent);color:var(--accent);border-radius:14px;padding:6px 18px;font-family:var(--serif);font-weight:700;font-size:2rem;background:#fde9e0cc;animation:stamp .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{from{scale:2.2;opacity:0}to{scale:1;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ====== აქ შეცვალე შენი კითხვები ======
const CONFIG = {
  title: "პატარა ტესტი",
  intro: "10 კითხვა შენს შესახებ. თუ ერთ ტალღაზე ვართ, გელოდება სიურპრიზი 😉",
  passScore: 7,
  maxAttempts: 2,
  questions: [
    {q: "შუაღამეა და მშია. რას აკეთებ?", a: ["თვითონ ვამზადებ რამეს","დელივერს ვუკვეთავ","მეგობარს ვუძახებ და ერთად გავდივართ","ვიძინებ და დილას ვჭამ"], ok: [0]},
    {q: "მეგობრებმა ბოლო წუთზე გამოგიძახეს, შენ კი სახლში დასვენება გქონდა დაგეგმილი.", a: ["დაუყოვნებლივ მივდივარ","ვრჩები სახლში","ვეპატიჟები მათ ჩემთან","განწყობაზეა დამოკიდებული"], ok: [2,3]},
    {q: "იდეალური მოგზაურობა:", a: ["უცნობი ქალაქი, გეგმის გარეშე","კარგად დაგეგმილი და კომფორტული","ბუნებაში, კარვებით","ქალაქში კაფეები და მუზეუმები"], ok: [0]},
    {q: "როცა შენ მართალი ხარ, მაგრამ ადამიანი არ გეთანხმება:", a: ["ბოლომდე ვდგავარ ჩემსას","ვცდილობ მის თვალით შევხედო","ვხუმრობ და თემას ვცვლი","ვტოვებ და მერე ვუბრუნდები"], ok: [0,1]},
    {q: "როცა ვინმე გაწყენინებს:", a: ["პირდაპირ ვეუბნები","ვდუმვარ და გავრბივარ","ხუმრობით ვაგებინებ","ვაპატიებ და გავაგრძელებ"], ok: [0]},
    {q: "რომელი თვისება გამოგარჩევს ყველაზე მეტად?", a: ["იუმორი","ერთგულება","ამბიცია","სიმშვიდე"], ok: [3,0]},
    {q: "შენი იდეალური საღამო:", a: ["სახლში ფილმი და საჭმელი","მეგობრებთან ერთად სუფრა","ახალი ადგილის აღმოჩენა","მუსიკა და ცეკვა"], ok: [1,2]},
    {q: "რამდენად გიყვარს სიურპრიზები?", a: ["ძალიან, ყოველთვის მინდა","მიყვარს, მაგრამ მცირე","მირჩევნია ყველაფერი ვიცოდე წინასწარ","დამოკიდებულია სიურპრიზზე"], ok: [3]},
    {q: "რა გაფასებინებს ადამიანს ყველაზე მეტად?", a: ["როცა დროს მითმობს","როცა მახარებს","როცა გულწრფელია","როცა ჩემზე ზრუნავს"], ok: [3]},
    {q: "ხუთ წელიწადში საკუთარ თავს ხედავ:", a: ["კარიერაში წარმატებული","ოჯახთან და ახლობლებთან ახლოს","მოგზაურობაში და თავისუფალი","საყვარელ საქმეს ვაკეთებ, დანარჩენი თავისით მოვა"], ok: [3]}
  ]
};
// ======================================
const app = document.getElementById("app");
const L = ["ა","ბ","გ","დ","ე"];
const KEY = "ge_quiz_attempts_v1";
let i = 0, locked = false, picks = [], score = 0;

function attempts(){ try { return +localStorage.getItem(KEY) || 0; } catch(_) { return 0; } }
function addAttempt(){ try { localStorage.setItem(KEY, String(attempts()+1)); } catch(_) {} }

function intro(){
  if(attempts() >= CONFIG.maxAttempts) return final();
  i = 0; picks = [];
  const left = CONFIG.maxAttempts - attempts();
  app.innerHTML = `<section class="card c"><div class="emoji">💌</div><h1>${CONFIG.title}</h1><p>${CONFIG.intro}</p>
    <p style="font-size:.85rem">გავლა: ${CONFIG.questions.length}-დან მინიმუმ ${CONFIG.passScore} სწორი. შენ გაქვს ${left} ცდა.</p>
    <button class="btn" id="go">დავიწყოთ</button></section>`;
  document.getElementById("go").onclick = show;
}

function hearts(){
  return `<div class="hearts" aria-hidden="true">${CONFIG.questions.map((_,k)=>`<span class="${k<i?'on':''}">❤️</span>`).join("")}</div>`;
}

function show(){
  locked = false;
  const Q = CONFIG.questions[i];
  app.innerHTML = `<section class="card">${hearts()}
    <p style="margin:0 0 6px;font-size:.85rem">კითხვა ${i+1} / ${CONFIG.questions.length}</p>
    <div class="q">${Q.q}</div>
    ${Q.a.map((t,k)=>`<button class="opt" data-k="${k}"><b>${L[k]}</b><span>${t}</span></button>`).join("")}</section>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(b));
}

function pick(btn){
  if(locked) return; locked = true;
  btn.classList.add("sel");
  picks.push(+btn.dataset.k);
  setTimeout(()=>{ i++; i < CONFIG.questions.length ? show() : finish(); }, 450);
}

function finish(){
  score = picks.filter((k,n)=>CONFIG.questions[n].ok.includes(k)).length;
  if(score >= CONFIG.passScore) return result();
  addAttempt();
  const left = CONFIG.maxAttempts - attempts();
  if(left > 0){
    app.innerHTML = `<section class="card c"><div class="emoji">😅</div><h1>ცოტა დააკლდა</h1>
      <p>შენი შედეგი: ${score} / ${CONFIG.questions.length}. გასავლელად საჭიროა მინიმუმ ${CONFIG.passScore}.</p>
      <p>გაქვს კიდევ <b>${left}</b> ცდა, სცადე!</p>
      <button class="btn" id="again">თავიდან ცდა</button></section>`;
    document.getElementById("again").onclick = intro;
  } else {
    app.innerHTML = finalHtml(score);
  }
}

function finalHtml(sc){
  return `<section class="card c"><div class="emoji">🙈</div><h1>ამჯერად არა</h1>
    <p>${sc === null ? "" : "შედეგი: " + sc + " / " + CONFIG.questions.length + ". "}ორივე ცდა გამოიყენე და ბილეთი ვერ მიიღე. მადლობა მონაწილეობისთვის 😊</p></section>`;
}
function final(){ app.innerHTML = finalHtml(null); }

const WHEN = ["ამ კვირაში","მომდევნო კვირას","როცა შენ გინდა"];

function result(){
  const lines = CONFIG.questions.map((q,k)=>`<li>${q.q}<br><span>${q.a[picks[k]]}</span></li>`).join("");
  app.innerHTML = `<section class="ticket" id="tk">
    <div class="stamp">ბილეთი ორზე</div>
    <small>ტესტი გაიარე · ${score} / ${CONFIG.questions.length}</small>
    <h1>ბილეთი შენია!</h1>
    <div class="perf"></div>
    <p class="ask" style="color:inherit">წამოხვალ ჩემთან დეითზე? 💕</p>
    <div id="act">
      <button class="btn" id="yes">კი, წამოვალ</button>
      <button class="btn ghost" id="maybe">ჯერ დავფიქრდები</button>
    </div>
    <ul class="ans" style="margin-top:18px">${lines}</ul></section>`;
  const stampIt = (txt) => {
    const old = document.querySelector(".bigstamp"); if(old) old.remove();
    const d = document.createElement("div"); d.className = "bigstamp"; d.textContent = txt;
    document.getElementById("tk").appendChild(d);
  };
  const when = () => {
    document.getElementById("act").innerHTML = `<p style="color:#5b3a47;margin:0">მეც ძალიან გამიხარდა! 🥰 როდის გაწყობს?</p><div class="chips" id="ch"></div>`;
    const ch = document.getElementById("ch");
    WHEN.forEach(w => { const b = document.createElement("button"); b.className = "chip"; b.textContent = w;
      b.onclick = () => {
        stampIt("დათანხმდა ✓");
        document.querySelector(".ask").textContent = "დეითი: " + w + " 💕";
        document.getElementById("act").innerHTML = `<p style="color:#5b3a47;margin:0">მზადაა! გადაუღე ამ ბილეთს ეკრანის სურათი და გამომიგზავნე იქვე ჩატში 😉</p>`;
      }; ch.appendChild(b); });
  };
  document.getElementById("yes").onclick = when;
  document.getElementById("maybe").onclick = () => {
    stampIt("ვფიქრობ…");
    document.getElementById("act").innerHTML = `<p style="color:#5b3a47;margin:0">კარგი, ველოდები 😊 ბილეთი მოქმედია.</p><button class="btn" id="back">მზად ვარ, კი!</button>`;
    document.getElementById("back").onclick = () => { document.querySelector(".bigstamp")?.remove(); when(); };
  };
}
intro();
</script>
</body>
</html>
